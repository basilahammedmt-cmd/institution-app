                    <th className="p-3">ബാച്ച്</th>
                    <th className="p-3">ആകെ ഫീസ്</th>
                    <th className="p-3">അടച്ചത്</th>
                    <th className="p-3">ബാക്കി</th>
                    <th className="p-3">സ്റ്റാറ്റസ്</th>
                  </tr>
                </thead>
                <tbody className="divide-y">
                  {students.map((s) => {
                    const bal = s.totalFee - s.discount - s.paidFee;
                    return (
                      <tr key={s.id}>
                        <td className="p-3 font-bold">{s.name}</td>
                        <td className="p-3 text-xs">{s.batchName}</td>
                        <td className="p-3">₹{s.totalFee}</td>
                        <td className="p-3 text-[#2d7a47] font-bold">₹{s.paidFee}</td>
                        <td className="p-3 text-rose-600 font-extrabold">₹{bal}</td>
                        <td className="p-3">
                          <span
                            className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                              bal <= 0 ? "bg-emerald-100 text-[#2d7a47]" : "bg-rose-100 text-rose-800"
                            }`}
                          >
                            {bal <= 0 ? "Fully Paid" : "Pending Balance"}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          );
        }

        if (activeView === "communication") {
          return (
            <div className="bg-white p-6 rounded-xl border space-y-4 shadow-sm">
              <h3 className="font-bold text-[#195685]">💬 വാട്സാപ്പ് ഗ്രൂപ്പ് & രക്ഷിതാക്കളുമായുള്ള ആശയവിനിമയം</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {batches.map((b) => (
                  <div key={b.id} className="p-4 rounded-xl border border-emerald-200 bg-emerald-50/40 space-y-2">
                    <h4 className="font-bold text-[#195685]">{b.name}</h4>
                    <p className="text-xs text-slate-600">അധ്യാപകൻ: {b.classTeacher}</p>
                    <a
                      href={b.whatsappGroupLink}
                      target="_blank"
                      rel="noreferrer"
                      className="inline-block bg-[#2d7a47] text-white px-4 py-2 rounded-lg text-xs font-bold"
                    >
                      💬 ബാച്ച് വാട്സാപ്പ് ഗ്രൂപ്പ് തുറക്കുക
                    </a>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        if (activeView === "question_bank" || activeView === "materials") {
          return (
            <div className="space-y-4">
              <h3 className="font-bold text-[#195685] text-lg">
                📚 പഠന സാമഗ്രികളും ക്വസ്റ്റ്യൻ ബാങ്കും (NOTES & QUESTION BANK / MATERIALS)
              </h3>
              {questionBank.map((qb) => (
                <div key={qb.id} className="bg-white p-6 rounded-xl border space-y-3 shadow-sm">
                  <span className="px-2.5 py-0.5 bg-cyan-50 text-[#169bc2] border border-cyan-200 rounded text-xs font-bold">
                    Class {qb.grade} • {qb.subject}
                  </span>
                  <h4 className="font-bold text-base text-[#195685]">{qb.title}</h4>
                  {qb.questionsList.map((q, i) => (
                    <div key={i} className="p-3 rounded-lg bg-slate-50 border space-y-1 text-xs">
                      <p className="font-bold">{q.q}</p>
                      <p className="text-[#2d7a47]">
                        <b>ഉത്തരം:</b> {q.a}
                      </p>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          );
        }

        if (activeView === "accounts") {
          const totalIncome = accounts.filter((a) => a.type === "Income").reduce((acc, a) => acc + a.amount, 0) + metrics.totalFeeCollected;
          const totalExpense = accounts.filter((a) => a.type === "Expense").reduce((acc, a) => acc + a.amount, 0);
          return (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <form onSubmit={handleAddAccountEntry} className="bg-white p-6 rounded-xl border space-y-3 shadow-sm">
                <h3 className="font-bold text-[#195685]">💵 പുതിയ വരവ് / ചെലവ് ചേർക്കുക (ACCOUNTS)</h3>
                <input
                  type="text"
                  required
                  placeholder="ഇനം (e.g. Electricity Bill / Exam Paper Print)"
                  value={newExpenseTitle}
                  onChange={(e) => setNewExpenseTitle(e.target.value)}
                  className="w-full border rounded-lg px-3 py-2 text-sm"
                />
                <select
                  value={newExpenseType}
                  onChange={(e) => setNewExpenseType(e.target.value)}
                  className="w-full border rounded-lg px-3 py-2 text-sm"
                >
                  <option value="Expense">ചെലവ് (Expense)</option>
                  <option value="Income">വരവ് (Income)</option>
                </select>
                <input
                  type="number"
                  value={newExpenseAmount}
                  onChange={(e) => setNewExpenseAmount(Number(e.target.value))}
                  className="w-full border rounded-lg px-3 py-2 text-sm"
                />
                <button type="submit" className="w-full bg-[#2d7a47] text-white font-bold py-2.5 rounded-lg text-sm">
                  കണക്കിലേക്ക് ചേർക്കുക
                </button>
              </form>

              <div className="lg:col-span-2 bg-white p-6 rounded-xl border space-y-4 shadow-sm">
                <h3 className="font-bold text-[#195685]">സ്ഥാപനത്തിന്റെ വരവ്-ചെലവ് കണക്കുകൾ (ACCOUNTS LEDGER)</h3>
                <div className="grid grid-cols-3 gap-3">
                  <div className="p-3.5 rounded-lg bg-emerald-50 border border-emerald-200">
                    <span className="text-xs text-[#2d7a47]">ആകെ വരവ് (Total Income)</span>
                    <p className="text-lg font-extrabold text-[#2d7a47]">₹{totalIncome.toLocaleString("en-IN")}</p>
                  </div>
                  <div className="p-3.5 rounded-lg bg-rose-50 border border-rose-200">
                    <span className="text-xs text-rose-700">ആകെ ചെലവ് (Expenses)</span>
                    <p className="text-lg font-extrabold text-rose-700">₹{totalExpense.toLocaleString("en-IN")}</p>
                  </div>
                  <div className="p-3.5 rounded-lg bg-cyan-50 border border-cyan-200">
                    <span className="text-xs text-[#195685]">നീക്കിയിരിപ്പ് (Net Balance)</span>
                    <p className="text-lg font-extrabold text-[#195685]">
                      ₹{(totalIncome - totalExpense).toLocaleString("en-IN")}
                    </p>
                  </div>
                </div>
                <div className="divide-y text-sm">
                  {accounts.map((acc) => (
                    <div key={acc.id} className="py-2.5 flex justify-between items-center">
                      <div>
                        <p className="font-bold">{acc.title}</p>
                        <p className="text-xs text-slate-500">{acc.date} • {acc.category}</p>
                      </div>
                      <span className={`font-bold ${acc.type === "Income" ? "text-[#2d7a47]" : "text-rose-600"}`}>
                        {acc.type === "Income" ? "+" : "-"}₹{acc.amount}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        }

        // Left sidebar buttons: COURSES, SCHEDULE, CLASSES, HOURS
        return (
          <div className="bg-white p-6 rounded-xl border border-slate-200 space-y-4 shadow-sm">
            <h3 className="font-bold text-[#195685] uppercase text-lg">
              {activeView} — A PLUS ACCADEMY (Classes 8, 9 & 10)
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {batches.map((b) => (
                <div key={b.id} className="p-4 rounded-xl border border-cyan-500/40 bg-slate-50 space-y-1.5">
                  <span className="px-2.5 py-0.5 bg-[#195685] text-white rounded text-xs font-bold">
                    Class {b.grade}
                  </span>
                  <h4 className="font-bold text-base text-slate-900">{b.courseTitle}</h4>
                  <p className="text-xs text-slate-700"><b>Batch:</b> {b.name}</p>
                  <p className="text-xs text-slate-700"><b>Schedule / Timing:</b> {b.timing}</p>
                  <p className="text-xs text-[#2d7a47] font-bold"><b>Total Hours:</b> {b.hoursPerWeek}</p>
                  <p className="text-xs text-slate-600"><b>Faculty-in-charge:</b> {b.classTeacher}</p>
                </div>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-white flex flex-col">
          {/* Subtle Top Mode Switcher (Web vs Mobile App View) */}
          <div className="bg-slate-100 border-b border-slate-200 px-4 py-1.5 flex justify-between items-center text-xs">
            <span className="text-slate-600 font-medium">
              A PLUS ACCADEMY • Govt. School Classes 8, 9, 10 Tuition Portal
            </span>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setDeviceMode("web")}
                className={`px-3 py-1 rounded font-bold transition ${
                  deviceMode === "web" ? "bg-[#195685] text-white" : "text-slate-600 hover:bg-slate-200"
                }`}
              >
                💻 Web Landing Page
              </button>
              <button
                onClick={() => setDeviceMode("mobile")}
                className={`px-3 py-1 rounded font-bold transition ${
                  deviceMode === "mobile" ? "bg-[#2d7a47] text-white" : "text-slate-600 hover:bg-slate-200"
                }`}
              >
                📱 Mobile App View (Android & iOS)
              </button>
            </div>
          </div>

          {deviceMode === "mobile" ? (
            /* ==================== MOBILE APP VIEW MATCHING THE PDF DESIGN ==================== */
            <div className="flex-1 bg-slate-100 py-6 px-4 flex flex-col items-center justify-center">
              <div className="phone-frame">
                {/* Mobile Header with A+ Logo & Title */}
                <div className="bg-white border-b border-cyan-600/40 px-4 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-2" onClick={() => setActiveView("home")}>
                    <div className="scale-75 -ml-2">
                      <AcademyLogoSVG />
                    </div>
                    <div>
                      <h2 className="academy-title font-extrabold text-base leading-none">A PLUS ACCADEMY</h2>
                      <p className="text-[10px] text-slate-500 mt-0.5">Classes 8, 9 & 10 • Tap icon to open</p>
                    </div>
                  </div>
                  {activeView !== "home" && (
                    <button
                      onClick={() => setActiveView("home")}
                      className="cyan-pill px-2.5 py-1 rounded text-[10px] font-bold"
                    >
                      ← HOME
                    </button>
                  )}
                </div>

                {/* Mobile Quick Pills (COURSES, SCHEDULE, CLASSES, HOURS, MATERIALS) */}
                <div className="px-3 py-2 bg-slate-50 border-b border-slate-200 flex gap-1.5 overflow-x-auto">
                  {leftSideButtons.map((btn) => (
                    <button
                      key={btn.id}
                      onClick={() => setActiveView(btn.id)}
                      className={`cyan-pill px-3 py-1 text-[10px] font-bold whitespace-nowrap ${btn.rounded}`}
                    >
                      {btn.label}
                    </button>
                  ))}
                </div>

                {/* Mobile Content Body */}
                <div className="flex-1 overflow-y-auto p-3">
                  {activeView === "home" ? (
                    <div className="grid grid-cols-3 gap-3 pt-2">
                      {[...topRowIcons, ...bottomRowIcons].map((item) => {
                        const IconComp = item.Component;
                        return (
                          <button
                            key={item.id}
                            onClick={() => setActiveView(item.id)}
                            className="launcher-card flex flex-col items-center p-2 rounded-xl hover:bg-slate-50"
                          >
                            <div className="scale-75 h-14 flex items-center justify-center">
                              <IconComp />
                            </div>
                            <span className="cyan-pill w-full py-1 px-1 rounded-md text-[9px] font-bold text-center leading-tight whitespace-pre-line">
                              {item.label}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="space-y-3 text-xs">{renderModuleContent()}</div>
                  )}
                </div>
              </div>
            </div>
          ) : (
            /* ==================== EXACT PDF LANDING PAGE LAYOUT (WEB) ==================== */
            <div className="flex-1 p-4 md:p-8 flex justify-center items-start bg-white">
              {/* Outer Framed Canvas matching PDF border */}
              <div className="w-full max-w-[1360px] min-h-[760px] border border-slate-400 bg-white flex relative shadow-sm">
                {/* Left Vertical Column separated by thin vertical line */}
                <div className="w-40 md:w-48 border-r border-cyan-600/60 flex flex-col pt-36 px-3 space-y-4 flex-shrink-0">
                  {leftSideButtons.map((btn) => (
                    <React.Fragment key={btn.id}>
                      {btn.spacerBefore && <div className="h-6" />}
                      <button
                        onClick={() => setActiveView(btn.id)}
                        className={`cyan-pill w-full py-2.5 px-3 text-xs md:text-sm font-medium tracking-wide text-center ${
                          btn.rounded
                        } ${activeView === btn.id ? "active font-bold" : ""}`}
                      >
                        {btn.label}
                      </button>
                    </React.Fragment>
                  ))}
                  {/* Bottom decorative double line box from PDF */}
                  <div className="h-9 w-full border border-cyan-600/60 mt-2" />
                </div>

                {/* Right Main Content Area */}
                <div className="flex-1 flex flex-col min-w-0">
                  {/* Top Header with A+ Logo and A PLUS ACCADEMY */}
                  <div className="h-32 px-6 md:px-14 flex items-center justify-between border-b border-cyan-600/60">
                    <div
                      onClick={() => setActiveView("home")}
                      className="flex items-center gap-8 md:gap-16 cursor-pointer mx-auto"
                    >
                      <AcademyLogoSVG />
                      <h1 className="academy-title text-2xl sm:text-4xl md:text-[42px] font-extrabold tracking-wider">
                        A PLUS ACCADEMY
                      </h1>
                    </div>

                    {activeView !== "home" && (
                      <button
                        onClick={() => setActiveView("home")}
                        className="cyan-pill px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 flex-shrink-0"
                      >
                        <span>🏠</span> ഹോം പേജിലേക്ക് മടങ്ങുക (LANDING PAGE)
                      </button>
                    )}
                  </div>

                  {/* Body Area: Either the 12-Icon PDF Landing Grid OR the Selected Module View */}
                  {activeView === "home" ? (
                    <div className="flex-1 px-6 md:px-12 py-10 flex flex-col justify-around">
                      {/* Row 1: 7 Icons (DASH BOARD to LIVE CLASSES) */}
                      <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-y-8 gap-x-4 items-start justify-items-center">
                        {topRowIcons.map((item) => {
                          const IconComp = item.Component;
                          return (
                            <div
                              key={item.id}
                              onClick={() => setActiveView(item.id)}
                              className="launcher-card flex flex-col items-center cursor-pointer group w-full max-w-[155px]"
                            >
                              <div className="h-24 flex items-center justify-center mb-2">
                                <IconComp />
                              </div>
                              <div className="cyan-pill w-full min-h-[38px] px-2 py-1.5 rounded-lg flex items-center justify-center text-center text-xs md:text-[13px] font-medium tracking-wide whitespace-pre-line leading-snug">
                                {item.label}
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {/* Row 2: 5 Icons (STUDENT FEE to ACCOUNTS) */}
                      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-y-8 gap-x-6 items-start justify-items-center max-w-5xl mx-auto w-full pt-6">
                        {bottomRowIcons.map((item) => {
                          const IconComp = item.Component;
                          return (
                            <div
                              key={item.id}
                              onClick={() => setActiveView(item.id)}
                              className="launcher-card flex flex-col items-center cursor-pointer group w-full max-w-[175px]"
                            >
                              <div className="h-24 flex items-center justify-center mb-2">
                                <IconComp />
                              </div>
                              <div className="cyan-pill w-full min-h-[40px] px-3 py-1.5 rounded-lg flex items-center justify-center text-center text-xs md:text-[13px] font-medium tracking-wide whitespace-pre-line leading-snug">
                                {item.label}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ) : (
                    /* Selected Feature View Inside the A PLUS ACCADEMY Frame */
                    <div className="flex-1 p-6 md:p-8 bg-slate-50/60 overflow-y-auto space-y-5">
                      {/* Quick Module Bar for jumping between icons */}
                      <div className="flex flex-wrap items-center gap-2 pb-3 border-b border-slate-200">
                        <button
                          onClick={() => setActiveView("home")}
                          className="px-3 py-1.5 rounded-lg bg-[#195685] text-white text-xs font-bold"
                        >
                          ⬅ എല്ലാം കാണുക (All Icons)
                        </button>
                        {[...topRowIcons, ...bottomRowIcons].map((item) => (
                          <button
                            key={item.id}
                            onClick={() => setActiveView(item.id)}
                            className={`cyan-pill px-3 py-1 rounded-md text-xs font-semibold ${
                              activeView === item.id ? "active font-bold bg-cyan-50" : ""
                            }`}
                          >
                            {item.label.replace("\n", " ")}
                          </button>
                        ))}
                      </div>

                      {/* Render the clicked icon's full feature page */}
                      {renderModuleContent()}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
