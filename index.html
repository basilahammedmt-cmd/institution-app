                              <td className="p-3">
                                <span
                                  className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                                    bal <= 0 ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800"
                                  }`}
                                >
                                  {bal <= 0 ? "Fully Paid" : "Pending Balance"}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* 10. WHATSAPP COMMUNICATION */}
                {activeTab === "communication" && (
                  <div className="bg-white p-6 rounded-2xl border space-y-4">
                    <h3 className="font-bold text-slate-800">💬 വാട്സാപ്പ് ഗ്രൂപ്പ് & രക്ഷിതാക്കളുമായുള്ള ആശയവിനിമയം</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {batches.map((b) => (
                        <div key={b.id} className="p-4 rounded-xl border border-emerald-200 bg-emerald-50/50 space-y-2">
                          <h4 className="font-bold">{b.name}</h4>
                          <p className="text-xs text-slate-600">അധ്യാപകൻ: {b.classTeacher}</p>
                          <a
                            href={b.whatsappGroupLink}
                            target="_blank"
                            rel="noreferrer"
                            className="inline-block bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold"
                          >
                            💬 ബാച്ച് വാട്സാപ്പ് ഗ്രൂപ്പ് തുറക്കുക
                          </a>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 11. QUESTION BANK */}
                {activeTab === "question_bank" && (
                  <div className="space-y-4">
                    {questionBank.map((qb) => (
                      <div key={qb.id} className="bg-white p-6 rounded-2xl border space-y-3">
                        <span className="px-2.5 py-0.5 bg-indigo-100 text-indigo-800 rounded text-xs font-bold">
                          Class {qb.grade} • {qb.subject}
                        </span>
                        <h4 className="font-bold text-base">{qb.title}</h4>
                        {qb.questionsList.map((q, i) => (
                          <div key={i} className="p-3 rounded-xl bg-slate-50 border space-y-1 text-xs">
                            <p className="font-bold">{q.q}</p>
                            <p className="text-emerald-800">
                              <b>ഉത്തരം:</b> {q.a}
                            </p>
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                )}
              </main>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
