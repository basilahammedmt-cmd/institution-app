                              className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
                              style={{ backgroundColor: isActive ? "rgba(255,255,255,0.92)" : btn.bgLight }}

                              </div>
                            </div>

                            <div
                              key={item.id}
                              onClick={() => setActiveView(item.id)}
                              className="launcher-card flex flex-col items-center cursor-pointer group w-full max-w-[175px]"

                              <div className="h-24 flex items-center justify-center mb-2">
                                <IconComp />
                              </div>

                                {item.label}
                              </div>
                            </div>
                          );

                        <h2 className="font-bold text-base leading-tight tracking-wide text-white">

                    <nav className="space-y-1.5 mt-5">
                      {sidebarMenuItems.map((item) => {
                        const isActive = activeView === item.id;
                        return (
                          <button
                            key={item.id}
                            onClick={() => setActiveView(item.id)}
                            className={`w-full px-3.5 py-2.5 rounded-lg flex items-center gap-3.5 text-sm transition-all ${
                              isActive
                                ? "bg-[#1967d2] text-white font-bold shadow-sm"

                            <span className="flex-shrink-0">{item.icon}</span>
                            <span className="truncate">{item.label}</span>

                      {/* Notification Bell with Red Badge */}

                          <path d="M13.73 21a2 2 0 0 1-3.46 0" />

                        <span className="w-2.5 h-2.5 rounded-full bg-rose-500 border-2 border-white absolute top-1 right-1" />

                          </svg>

                          <polyline points="6 9 12 15 18 9" />
                        </svg>
                      </div>
                    </div>
                  </header>

                  {/* Body Content */}
                  <div className="flex-1 p-6 md:p-8 overflow-y-auto bg-white">
                    {renderModuleContent()}
                  </div>
                </main>
              </div>
            </div>
          )}

    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
